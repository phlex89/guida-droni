<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1074" role="img" aria-labelledby="flw-titolo" class="flw-svg">
  <title id="flw-titolo">Posso volare qui, oggi?</title>
  <style>
    .flw-svg text { font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif; }
    .flw-titolo { font-size: 32px; font-weight: 600; fill: #12354A; }
    .flw-dom { font-size: 22px; font-weight: 600; fill: #12354A; }
    .flw-azi { font-size: 22px; fill: #2B2D31; }
    .flw-esi { font-size: 24px; font-weight: 600; fill: #12354A; }
    .flw-ram { font-size: 22px; font-weight: 600; fill: #12354A; }
    .flw-ramr { font-size: 22px; font-weight: 600; fill: #B23A3A; }
    .flw-ramo { font-size: 22px; font-weight: 600; fill: #E0851F; }
    .flw-rombo { fill: #FFFFFF; stroke: #1B4965; stroke-width: 2.5; }
    .flw-l { fill: none; stroke-width: 3; stroke-linejoin: round; }
    .flw-lb { stroke: #1B4965; }
    .flw-lr { stroke: #B23A3A; }
    .flw-lo { stroke: #E0851F; }
    .flw-lv { stroke: #3E8E63; }
  </style>
  <defs>
    <marker id="flw-fr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1B4965"/></marker>
    <marker id="flw-fr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B23A3A"/></marker>
    <marker id="flw-fr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#E0851F"/></marker>
    <marker id="flw-fr-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3E8E63"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1074" fill="#FFFFFF"/>
  <text class="flw-titolo" x="24" y="46">Posso volare qui, oggi?</text>

  <g id="flw-registrazione">
    <path class="flw-rombo" d="M330,68 L620,130 L330,192 L40,130 Z"/>
    <text class="flw-dom" x="330" y="124" text-anchor="middle">MTOM da 250 g in su, oltre 80 J</text>
    <text class="flw-dom" x="330" y="150" text-anchor="middle">o sensore di dati personali?</text>

    <path class="flw-l flw-lb" d="M620,130 H662" marker-end="url(#flw-fr-b)"/>
    <text class="flw-ram" x="641" y="117" text-anchor="middle">Sì</text>
    <rect x="670" y="80" width="310" height="100" rx="10" fill="#DCEEF8" stroke="#1B4965" stroke-width="2.5"/>
    <text class="flw-azi" x="684" y="114">Registrati come operatore</text>
    <text class="flw-azi" x="684" y="140">su d-flight e applica il</text>
    <text class="flw-azi" x="684" y="166">numero su ogni tuo drone</text>
  </g>

  <path class="flw-l flw-lb" d="M825,180 V222 H330"/>
  <circle cx="330" cy="222" r="5.5" fill="#1B4965"/>
  <path class="flw-l flw-lb" d="M330,192 V232" marker-end="url(#flw-fr-b)"/>
  <text class="flw-ram" x="346" y="212">No, o giocattolo conforme</text>

  <g id="flw-drone">
    <path class="flw-rombo" d="M330,236 L620,298 L330,360 L40,298 Z"/>
    <text class="flw-dom" x="330" y="292" text-anchor="middle">Il drone è ammesso nella</text>
    <text class="flw-dom" x="330" y="318" text-anchor="middle">sottocategoria che ti serve?</text>

    <path class="flw-l flw-lr" d="M620,298 H662" marker-end="url(#flw-fr-r)"/>
    <text class="flw-ram" x="641" y="285" text-anchor="middle">No</text>
    <rect x="670" y="260" width="310" height="76" rx="24" fill="#F6E2E2" stroke="#B23A3A" stroke-width="2.5"/>
    <text class="flw-esi" x="684" y="295">Cambia drone,</text>
    <text class="flw-esi" x="684" y="325">sottocategoria o area</text>
  </g>

  <path class="flw-l flw-lb" d="M330,360 V404" marker-end="url(#flw-fr-b)"/>
  <text class="flw-ram" x="346" y="392">Sì</text>

  <g id="flw-formazione">
    <path class="flw-rombo" d="M330,404 L620,466 L330,528 L40,466 Z"/>
    <text class="flw-dom" x="330" y="460" text-anchor="middle">Questa operazione richiede una</text>
    <text class="flw-dom" x="330" y="486" text-anchor="middle">formazione che non hai ancora?</text>

    <path class="flw-l flw-lr" d="M620,466 H662" marker-end="url(#flw-fr-r)"/>
    <text class="flw-ram" x="641" y="453" text-anchor="middle">Sì</text>
    <rect x="670" y="428" width="310" height="76" rx="24" fill="#F6E2E2" stroke="#B23A3A" stroke-width="2.5"/>
    <text class="flw-esi" x="684" y="463">Fermati:</text>
    <text class="flw-esi" x="684" y="493">prima la formazione</text>
  </g>

  <path class="flw-l flw-lb" d="M330,528 V572" marker-end="url(#flw-fr-b)"/>
  <text class="flw-ram" x="346" y="560">No</text>

  <g id="flw-zona">
    <path class="flw-rombo" d="M330,572 L620,652 L330,732 L40,652 Z"/>
    <text class="flw-dom" x="330" y="626" text-anchor="middle">Apri la scheda della zona</text>
    <text class="flw-dom" x="330" y="652" text-anchor="middle">sulla mappa d-flight.</text>
    <text class="flw-dom" x="330" y="678" text-anchor="middle">Che cosa richiede?</text>

    <path class="flw-l flw-lr" d="M620,652 H645 V572 H662" marker-end="url(#flw-fr-r)"/>
    <text class="flw-ramr" x="670" y="536">Esclude la categoria Open</text>
    <rect x="670" y="544" width="310" height="56" rx="24" fill="#F6E2E2" stroke="#B23A3A" stroke-width="2.5"/>
    <text class="flw-esi" x="684" y="579">Non decollare</text>

    <path class="flw-l flw-lo" d="M645,652 V679 H662" marker-end="url(#flw-fr-o)"/>
    <text class="flw-ramo" x="670" y="628">Pone condizioni</text>
    <rect x="670" y="636" width="310" height="86" rx="10" fill="#FCEEDC" stroke="#E0851F" stroke-width="2.5"/>
    <text class="flw-azi" x="684" y="671">Soddisfa quote, orari</text>
    <text class="flw-azi" x="684" y="701">e nulla osta indicati</text>
  </g>

  <path class="flw-l flw-lo" d="M825,722 V756 H330"/>
  <circle cx="330" cy="756" r="5.5" fill="#1B4965"/>
  <path class="flw-l flw-lb" d="M330,732 V776" marker-end="url(#flw-fr-b)"/>
  <text class="flw-ram" x="346" y="744">Nessuna condizione residua</text>

  <g id="flw-giorno">
    <path class="flw-rombo" d="M330,776 L620,856 L330,936 L40,856 Z"/>
    <text class="flw-dom" x="330" y="830" text-anchor="middle">Distanze, quota, meteo, batterie?</text>
    <text class="flw-dom" x="330" y="856" text-anchor="middle">Assicurazione attiva? Luce verde</text>
    <text class="flw-dom" x="330" y="882" text-anchor="middle">se di notte? Nessun assembramento?</text>

    <path class="flw-l flw-lo" d="M620,856 H662" marker-end="url(#flw-fr-o)"/>
    <text class="flw-ram" x="641" y="843" text-anchor="middle">No</text>
    <rect x="670" y="828" width="310" height="56" rx="24" fill="#FCEEDC" stroke="#E0851F" stroke-width="2.5"/>
    <text class="flw-esi" x="684" y="863">Rinvia</text>
  </g>

  <path class="flw-l flw-lv" d="M330,936 V968" marker-end="url(#flw-fr-v)"/>
  <text class="flw-ram" x="346" y="962">Sì</text>
  <rect x="40" y="972" width="940" height="82" rx="24" fill="#E3F2E9" stroke="#3E8E63" stroke-width="2.5"/>
  <text class="flw-esi" x="510" y="1010" text-anchor="middle">I controlli di questa scheda sono soddisfatti.</text>
  <text class="flw-esi" x="510" y="1040" text-anchor="middle">Resta sotto i 120 m, in vista, alle distanze della tua sottocategoria.</text>
</svg>
