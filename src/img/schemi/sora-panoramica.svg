<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="sor-titolo" class="sor-svg">
  <title id="sor-titolo">Le tre categorie: il rischio cresce, crescono i requisiti</title>
  <style>
    .sor-svg text { font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif; }
    .sor-titolo { font-size: 32px; font-weight: 600; fill: #12354A; }
    .sor-nome { font-size: 28px; font-weight: 700; fill: #FFFFFF; }
    .sor-liv { font-size: 22px; font-weight: 600; fill: #FFFFFF; }
    .sor-corpo { font-size: 22px; fill: #2B2D31; }
    .sor-asse { font-size: 24px; font-weight: 600; fill: #5C6370; }
  </style>
  <defs>
    <marker id="sor-fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5C6370"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="610" fill="#FFFFFF"/>
  <text class="sor-titolo" x="24" y="46">Le tre categorie: il rischio cresce, crescono i requisiti</text>

  <text class="sor-asse" x="500" y="86" text-anchor="middle">Rischio a terra e in aria</text>
  <path d="M20,106 H964" fill="none" stroke="#5C6370" stroke-width="3" marker-end="url(#sor-fr)"/>

  <rect x="20" y="230" width="308" height="288" rx="12" fill="#E3F2E9" stroke="#3E8E63" stroke-width="2.5"/>
  <path d="M20,242 a12,12 0 0 1 12,-12 h284 a12,12 0 0 1 12,12 V300 H20 Z" fill="#3E8E63"/>
  <text class="sor-nome" x="36" y="264">Open</text>
  <text class="sor-liv" x="36" y="292">Rischio basso</text>
  <text class="sor-corpo" x="36" y="330">Nessuna autorizzazione</text>
  <text class="sor-corpo" x="36" y="356">preventiva</text>
  <path d="M36,372 H312" stroke="#3E8E63" stroke-opacity="0.4" stroke-width="2" fill="none"/>
  <text class="sor-corpo" x="36" y="398">Regole fisse: sotto</text>
  <text class="sor-corpo" x="36" y="424">25 kg, VLOS, 120 m,</text>
  <text class="sor-corpo" x="36" y="450">sottocategorie A1-A3</text>

  <rect x="346" y="190" width="308" height="328" rx="12" fill="#FCEEDC" stroke="#E0851F" stroke-width="2.5"/>
  <path d="M346,202 a12,12 0 0 1 12,-12 h284 a12,12 0 0 1 12,12 V300 H346 Z" fill="#E0851F"/>
  <text class="sor-nome" x="362" y="264">Specific</text>
  <text class="sor-liv" x="362" y="292">Rischio medio</text>
  <text class="sor-corpo" x="362" y="330">Autorizzazione operativa</text>
  <text class="sor-corpo" x="362" y="356">dell'autorità (ENAC)</text>
  <path d="M362,372 H638" stroke="#E0851F" stroke-opacity="0.45" stroke-width="2" fill="none"/>
  <text class="sor-corpo" x="362" y="398">Tre strade: scenario</text>
  <text class="sor-corpo" x="362" y="424">standard (STS) con</text>
  <text class="sor-corpo" x="362" y="450">dichiarazione, valutazione</text>
  <text class="sor-corpo" x="362" y="476">predefinita (PDRA),</text>
  <text class="sor-corpo" x="362" y="502">analisi del rischio SORA</text>

  <rect x="672" y="150" width="308" height="368" rx="12" fill="#F6E2E2" stroke="#B23A3A" stroke-width="2.5"/>
  <path d="M672,162 a12,12 0 0 1 12,-12 h284 a12,12 0 0 1 12,12 V300 H672 Z" fill="#B23A3A"/>
  <text class="sor-nome" x="688" y="264">Certified</text>
  <text class="sor-liv" x="688" y="292">Rischio alto</text>
  <text class="sor-corpo" x="688" y="330">Certificazione come per</text>
  <text class="sor-corpo" x="688" y="356">l'aviazione con equipaggio</text>
  <path d="M688,372 H964" stroke="#B23A3A" stroke-opacity="0.4" stroke-width="2" fill="none"/>
  <text class="sor-corpo" x="688" y="398">Trasporto di persone,</text>
  <text class="sor-corpo" x="688" y="424">merci pericolose, sorvolo</text>
  <text class="sor-corpo" x="688" y="450">di assembramenti</text>

  <path d="M20,552 H964" fill="none" stroke="#5C6370" stroke-width="3" marker-end="url(#sor-fr)"/>
  <text class="sor-asse" x="500" y="586" text-anchor="middle">Onere per l'operatore</text>
</svg>
